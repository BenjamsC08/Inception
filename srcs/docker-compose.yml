networks:
  WP_Network:

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: 'bind'
      device: "${MARIADB_DATA_PATH}"

  wordpress_file:
    driver: local
    driver_opts:
      type: none
      o: 'bind'
      device: "${WORDPRESS_DATA_PATH}"

