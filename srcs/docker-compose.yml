services:
  mariadb:
    build: ./requirements/mariadb/
    restart: on-failure
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      # MARIADB_ROOT_PASSWORD_HASH: "${MARIADB_ROOT_PASSWORD}"  // maybe change for the hash is more secure
      MARIADB_DATABASE: "${MARIADB_DB_NAME}"
      MARIADB_USER: "${MARIADB_USER_NAME}"
      MARIADB_PASSWORD: "${MARIADB_USER_PASSWORD}"
      # MARIADB_PASSWORD_HASH: "${MARIADB_USER_PASSWORD}"   //same here
    networks:
        - WP_Network
    volumes:
        - mariadb_data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    depends_on:
      - mariadb
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME}"
      WORDPRESS_DB_HOST: "${WORDPRESS_DB_HOST}"
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD}"
      WORDPRESS_ADMIN_USER: "${WORDPRESS_ADMIN_USER}"
      WORDPRESS_ADMIN_PASSWORD: "${WORDPRESS_ADMIN_PASSWORD}"
      WORDPRESS_ADMIN_EMAIL: "${WORDPRESS_ADMIN_EMAIL}"
      WORDPRESS_USER: "${WORDPRESS_USER}"
      WORDPRESS_USER_EMAIL: "${WORDPRESS_USER_EMAIL}"
      WORDPRESS_USER_PASSWORD: "${WORDPRESS_USER_PASSWORD}"
    networks:
        - WP_Network
    volumes:
        - wordpress_file:/var/www/html
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: on-failure
    depends_on:
        - wordpress
    ports:
      - "443:443"
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME}"
    networks:
        - WP_Network
    volumes:
        - wordpress_file:/var/www/html

networks:
  WP_Network:

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: 'bind'
      device: "${MARIADB_DATA_PATH}"

  wordpress_file:
    driver: local
    driver_opts:
      type: none
      o: 'bind'
      device: "${WORDPRESS_DATA_PATH}"

