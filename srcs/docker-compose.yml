services:
  mariadb:
    build: ./requirements/mariadb/
    restart: on-failure
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      # MARIADB_ROOT_PASSWORD_HASH: "${MARIADB_ROOT_PASSWORD}"  // maybe change for the hash is more secure
      MARIADB_DATABASE: "${MARIADB_DB_NAME}"
      MARIADB_USER: "${MARIADB_USER_NAME}"
      MARIADB_PASSWORD: "${MARIADB_USER_PASSWORD}"
      # MARIADB_PASSWORD_HASH: "${MARIADB_USER_PASSWORD}"   //same here
    networks:
        - WP_Network
    volumes:
        - mariadb_data:/var/lib/mysql

